matrix_path: "hafta6_model/data/train_matrix.npz"
user_map_path: "hafta6_model/data/user_index_map.csv"
item_map_path: "hafta6_model/data/item_index_map.csv"

model_path: "hafta6_model/data/bpr_model.pkl"
report_path: "hafta6_model/reports/rapor_bpr_egitim.txt"

# SVD'deki n_factors/n_epochs'a karsilik gelen parametreler.
# Not: tune_bpr.py denemesinde en iyi sonucu veren "Config C" degerleri
# (HitRate@10 = 0.2573, baseline'a gore ~%25 gorece iyilesme).
factors: 50
iterations: 250
learning_rate: 0.01
regularization: 0.05

# Tekrar uretilebilirlik icin sabit random seed (diger modellerle ayni).
random_state: 42
